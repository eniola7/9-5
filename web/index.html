<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1.00001, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0E1113" />
    <meta name="description" content="LOLO is a premium credit intelligence platform for credit training, loan readiness, and financial confidence." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LOLO" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/lolo-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/lolo-maskable.svg" />
    <title>LOLO — Credit Intelligence Platform</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        -webkit-overflow-scrolling: touch;
      }

      html {
        height: calc(100% + env(safe-area-inset-top));
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
        background: #0e1113;
      }

      body {
        display: flex;
        overflow-y: auto;
        overscroll-behavior-y: none;
        background:
          radial-gradient(circle at 20% 10%, rgba(34, 197, 94, 0.18), transparent 30%),
          radial-gradient(circle at 80% 0%, rgba(74, 222, 128, 0.1), transparent 28%),
          #0e1113;
        color: #e5e7eb;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        display: flex;
        flex: 1;
      }

      #pwa-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 35%, rgba(34, 197, 94, 0.18), transparent 32%),
          #0e1113;
        transition: opacity 220ms ease;
      }

      #pwa-splash-card {
        width: min(78vw, 320px);
        padding: 28px;
        border: 1px solid rgba(74, 222, 128, 0.32);
        border-radius: 28px;
        background: rgba(22, 27, 30, 0.72);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45), 0 0 44px rgba(34, 197, 94, 0.16);
        text-align: center;
        backdrop-filter: blur(18px);
      }

      #pwa-splash-logo {
        color: #4ade80;
        font: 900 38px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      #pwa-splash-subtitle {
        margin-top: 10px;
        color: #9ca3af;
        font: 700 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
    </style>
  </head>
  <body>
    <noscript>LOLO needs JavaScript enabled to run the interactive credit intelligence demo.</noscript>
    <div id="pwa-splash" aria-hidden="true">
      <div id="pwa-splash-card">
        <div id="pwa-splash-logo">LOLO</div>
        <div id="pwa-splash-subtitle">Credit intelligence loading...</div>
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>
